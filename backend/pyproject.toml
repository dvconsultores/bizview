[project]
name = "bizview-backend"
version = "0.1.0"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3,<3.4",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "anthropic>=1.9,<2",
    "httpx>=0.27",
    "cryptography>=46",
    "zeep>=4.3",
    "pyotp>=2.10",
    "segno>=1.6",
    "bizview-cli>=0.1.0",
    "polars>=1.44,<2",
    "apscheduler>=3.10,<4",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[tool.uv.sources]
bizview-cli = { path = "../cli", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["slow: opt-in performance tests (run with BIZVIEW_SLOW_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["B008"]  # FastAPI dependencies are declared as argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "E731"]  # settings must be set before the app is imported
"scripts/bench_rollup.py" = ["E402"]  # DB_SCHEMA (the throwaway schema) is set before settings
"app/i18n/es.py" = ["E501"]  # message catalogues hold whole sentences
"app/i18n/en.py" = ["E501"]  # message catalogues hold whole sentences
