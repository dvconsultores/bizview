# caddy (edge: SPA + /api proxy + TLS) → backend (FastAPI) → BI database (always external: DATABASE_URL_BI)
# worker: integration runs from the applied version of BI projects (feature 020)
#
# Two ways to run this file, same services:
#   developer: docker compose -f bizview.yml up -d --build    # builds the images from this tree
#   server:    docker compose -f bizview.yml pull && docker compose -f bizview.yml up -d
#              # pulls what deploy.sh pushed: <BIZVIEW_IMAGE_PREFIX>/bizview-{backend,web}:<tag>
name: bizview

services:
  backend:
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    image: ${BIZVIEW_IMAGE_PREFIX:-dvconsultores}/bizview-backend:${BIZVIEW_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    restart: unless-stopped
    expose: ["8000"]
    environment:
      POLARS_TEMP_DIR: ${POLARS_TEMP_DIR:-/tmp/bizview-polars}
      PROJECTS_DIR: /app/data/projects
      ATTACHMENTS_DIR: /app/data/attachments
    volumes:
      - ${PROJECTS_DIR_HOST:-./projects}:/app/data/projects     # BI projects (feature 020), read-write, backend only
      - ${ATTACHMENTS_DIR_HOST:-./attachments}:/app/data/attachments   # chat image briefs (feature 024)

  worker:                      # integration runs (feature 005): same image, other entry point
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    image: ${BIZVIEW_IMAGE_PREFIX:-dvconsultores}/bizview-backend:${BIZVIEW_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      POLARS_TEMP_DIR: ${POLARS_TEMP_DIR:-/tmp/bizview-polars}  # Polars streaming spill (whole-mode transforms)
      ATTACHMENTS_DIR: /app/data/attachments   # feature 024: the worker sweeps unsent images
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - ${ATTACHMENTS_DIR_HOST:-./attachments}:/app/data/attachments   # feature 024
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    image: ${BIZVIEW_IMAGE_PREFIX:-dvconsultores}/bizview-web:${BIZVIEW_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CADDY_ALLOWED_HOSTS: ${CADDY_ALLOWED_HOSTS:-localhost}
      CADDY_MAX_REQUEST_BODY: ${CADDY_MAX_REQUEST_BODY:-100MB}
      CADDY_TLS: ${CADDY_TLS:-auto}
      CADDY_TLS_CERT: ${CADDY_TLS_CERT:-/certs/origin.pem}
      CADDY_TLS_KEY: ${CADDY_TLS_KEY:-/certs/origin-key.pem}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      # LEFT of the colon is the host port and the only side that can collide with another stack.
      # RIGHT is inside the container, where Caddy always listens on 80 and 443: publishing 8443
      # does not bind or need host 443, so a host whose 443 belongs to another service is fine.
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8443}:443"
      # HTTP/3 (QUIC) uses the same number over UDP; delete this line if that host UDP port is
      # taken (only the HTTP/3 fast path is lost, HTTPS keeps working over TCP).
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      # Only read when CADDY_TLS=file; an empty directory is harmless.
      - ${CADDY_TLS_DIR:-./deploy/caddy/certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Pulls a new image when deploy.sh publishes one and recreates only the containers labelled
  # above, so other stacks on a shared host are never touched (WATCHTOWER_LABEL_ENABLE). Needs the
  # Docker socket: it can control every container on the host, so remove this service if the host
  # is not trusted with it.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: bizview-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"            # only the labelled services, never the whole host
      WATCHTOWER_CLEANUP: "true"                 # delete the superseded image after a swap
      WATCHTOWER_ROLLING_RESTART: "true"         # one at a time, so the site stays up
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No ports, no volumes of its own: it only talks to the Docker API.


volumes:
  caddy_data:
  caddy_config:
