# caddy (edge: SPA + /api proxy + TLS) → backend (FastAPI) → BI database (always external: DATABASE_URL_BI)
# worker: integration runs from the applied version of BI projects (feature 020)
#
# Two ways to run this file, same services:
#   developer: docker compose -f bizview.yml up -d --build    # builds the images from this tree
#   server:    docker compose -f bizview.yml pull && docker compose -f bizview.yml up -d
#              # pulls what deploy.sh pushed: <BIZVIEW_IMAGE_PREFIX>/bizview-{backend,web}:<tag>
name: bizview

services:
  backend:
    image: ${BIZVIEW_IMAGE_PREFIX:-andresdom2004}/bizview-backend:${BIZVIEW_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    restart: unless-stopped
    expose: ["8000"]
    environment:
      POLARS_TEMP_DIR: ${POLARS_TEMP_DIR:-/tmp/bizview-polars}
      PROJECTS_DIR: /app/data/projects
      ATTACHMENTS_DIR: /app/data/attachments
    volumes:
      - ${PROJECTS_DIR_HOST:-./projects}:/app/data/projects     # BI projects (feature 020), read-write, backend only
      - ${ATTACHMENTS_DIR_HOST:-./attachments}:/app/data/attachments   # chat image briefs (feature 024)

  worker:                      # integration runs (feature 005): same image, other entry point
    image: ${BIZVIEW_IMAGE_PREFIX:-andresdom2004}/bizview-backend:${BIZVIEW_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      POLARS_TEMP_DIR: ${POLARS_TEMP_DIR:-/tmp/bizview-polars}  # Polars streaming spill (whole-mode transforms)
      ATTACHMENTS_DIR: /app/data/attachments   # feature 024: the worker sweeps unsent images
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - ${ATTACHMENTS_DIR_HOST:-./attachments}:/app/data/attachments   # feature 024
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: ${BIZVIEW_IMAGE_PREFIX:-andresdom2004}/bizview-web:${BIZVIEW_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CADDY_ALLOWED_HOSTS: ${CADDY_ALLOWED_HOSTS:-localhost}
      CADDY_MAX_REQUEST_BODY: ${CADDY_MAX_REQUEST_BODY:-100MB}
      CADDY_TLS: ${CADDY_TLS:-auto}
      CADDY_TLS_CERT: ${CADDY_TLS_CERT:-/certs/origin.pem}
      CADDY_TLS_KEY: ${CADDY_TLS_KEY:-/certs/origin-key.pem}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      # Only read when CADDY_TLS=file; an empty directory is harmless.
      - ${CADDY_TLS_DIR:-./deploy/caddy/certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped


volumes:
  caddy_data:
  caddy_config:
