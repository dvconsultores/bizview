# Reporte directo de ventas consolidadas.
# Métricas y dimensiones usan únicamente el alias `v` declarado en direct.
id: ventas-directo
spec: specs/001-ventas-directo
title: Ventas directo
description: Total vendido, unidades, ticket promedio y detalle por sucursal y producto.
icon: chart

direct:
  source: bi
  tables:
    v:
      table: public.bi_ventas
      columns:
        fecha:
          type: date
        sucursal:
          type: text
        producto:
          type: text
        monto:
          type: numeric
        unidades:
          type: integer
  cache_seconds: 300

date: v.fecha

metrics:
  total_vendido:
    label: Total vendido
    sql: "sum(v.monto)"
    format: currency
    better: higher
  unidades_vendidas:
    label: Unidades vendidas
    sql: "sum(v.unidades)"
    format: integer
    better: higher
  ticket_promedio:
    label: Ticket promedio
    formula: total_vendido / unidades_vendidas    # combina métricas con sql
    format: currency
    better: higher

dimensions:
  sucursal:
    label: Sucursal
    sql: v.sucursal
  producto:
    label: Producto
    sql: v.producto

views:
  # El layout enlaza las vistas por id.
  - id: resumen
    type: kpis
    metrics: [total_vendido, unidades_vendidas, ticket_promedio]
  - id: diaria
    type: trend
    metric: total_vendido
    grain: day
  - id: productos
    type: ranking
    dimension: producto
    metric: total_vendido
    limit: 10
    title: "Ventas por producto"
  - id: detalle
    type: table
    dimensions: [sucursal, producto]
    metrics: [unidades_vendidas, total_vendido]
    limit: 100
    title: "Detalle por sucursal y producto"

filters: [sucursal, producto]

periods:
  default: mtd
  allowed: [today, yesterday, last_7_days, mtd, last_month, ytd]

compare:
  default: previous_period
  allowed: [none, previous_period, previous_year]

access:
  roles: [admin, user]
  grants: true

pdf:
  enabled: true                  # la exportación sigue habilitada; layout.pdf define la página

layout:
  pdf:
    page:
      size: a4
      orientation: portrait
      margins: {top: 12, right: 10, bottom: 12, left: 10}
    overflow: truncate
    blocks:
      - id: cabecera
        type: header
        title: true
        subtitle: true
        period: true
        logo: true
        logo_role: brand
      - id: fila_kpis
        type: kpi_row
        view: resumen
        items: [total_vendido, unidades_vendidas, ticket_promedio]
        delta: true
      - id: ventas_por_producto
        type: chart
        view: productos
        kind: bar
        x: producto
        series: [total_vendido]
        height_mm: 60
      - id: tabla_detalle
        type: table
        view: detalle
        columns: [sucursal, producto, unidades_vendidas, total_vendido]
        widths: [3, 2, 2, 2]
        totals: true
      - id: pie_documento
        type: footer
        generated_at: true
        page_numbers: true
        legal: "Documento generado por Bizview."
        legal_en: "Document generated by Bizview."
