# Reporte de facturación diaria.
# Métricas y dimensiones usan únicamente el alias `f` declarado en uses.
id: facturas-dia
spec: specs/002-facturas-dia
title: Facturación diaria
description: Total facturado, número de facturas, ticket promedio e impuesto por día.
icon: receipt

uses:
  f: facturas.facturas

date: f.fecha_emision

metrics:
  total_facturado:
    label: Total facturado
    sql: "sum(f.monto_total)"
    format: currency
    better: higher
  facturas:
    label: Facturas
    sql: "count(distinct f.numero)"
    format: integer
    better: higher
  ticket_promedio:
    label: Ticket promedio
    formula: total_facturado / facturas    # combina métricas con sql
    format: currency
    better: higher
  impuesto:
    label: Impuesto
    sql: "sum(coalesce(f.impuesto, 0))"
    format: currency

dimensions:
  estado:
    label: Estado
    sql: f.estado
  moneda:
    label: Moneda
    sql: f.moneda

views:
  # El layout enlaza las vistas por id.
  - id: resumen
    type: kpis
    metrics: [total_facturado, facturas, ticket_promedio]
  - id: diaria
    type: trend
    metric: total_facturado
    grain: day
  - id: estados
    type: ranking
    dimension: estado
    metric: total_facturado
    limit: 10
    title: "Facturación por estado"
  - id: detalle
    type: table
    dimensions: [estado, moneda]
    metrics: [facturas, total_facturado, impuesto]
    limit: 100
    title: "Detalle por estado y moneda"

filters: [estado, moneda]

periods:
  default: last_7_days
  allowed: [today, yesterday, last_7_days, mtd, last_month, ytd]

compare:
  default: previous_period
  allowed: [none, previous_period, previous_year]

access:
  roles: [admin, user]
  grants: true

pdf:
  enabled: true                  # la exportación sigue habilitada; layout.pdf define la página

layout:
  web:
    gutter: md
    components:
      - id: kpis_facturacion
        type: kpi
        view: resumen
        metric: total_facturado
        delta: previous_period
        span: 12
      - id: tendencia_diaria
        type: line
        view: diaria
        x: day            # la granularidad que declara la vista diaria
        series: [total_facturado]
        colors: [series1]
        span: 8
      - id: por_estado
        type: bar
        view: estados
        x: estado
        series: [total_facturado]
        orientation: horizontal
        span: 4
      - id: detalle_estado_moneda
        type: table
        view: detalle
        columns: [estado, moneda, facturas, total_facturado, impuesto]
        totals: true
        page_size: 25
        sort: {by: total_facturado, dir: desc}
        span: 12
      - id: nota_cierre
        type: text
        style: caption
        text: "Cifras provisionales del cierre del día."
        text_en: "Provisional figures for the day's close."
        span: 12
  pdf:
    page:
      size: a4
      orientation: portrait
      margins: {top: 12, right: 10, bottom: 12, left: 10}
    overflow: continue
    blocks:
      - id: cabecera
        type: header
        title: true
        subtitle: true
        period: true
        logo: true
        logo_role: brand
      - id: fila_kpis
        type: kpi_row
        view: resumen
        items: [total_facturado, facturas, ticket_promedio]
        delta: true
      - id: grafico_diario
        type: chart
        view: diaria
        kind: line
        x: day
        series: [total_facturado]
        height_mm: 60
      - id: tabla_detalle
        type: table
        view: detalle
        columns: [estado, moneda, facturas, total_facturado]
        widths: [3, 2, 1, 2]
        totals: true
        overflow: truncate
      - id: pie_documento
        type: footer
        generated_at: true
        page_numbers: true
        legal: "Documento generado por Bizview."
        legal_en: "Document generated by Bizview."
